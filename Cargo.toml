[package]
name = "bark-worker"
version = "0.1.0"
edition = "2024"
description = "Minimal Bark push server on Cloudflare Workers (Rust + WebAssembly)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "alloc"] }
sha2 = { version = "0.10", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
urlencoding = "2.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# 注意：不能写成 `strip = true` / `strip = "symbols"`。
# 那样会连同自定义段 `target_features` 一并剥离，wasm-bindgen 无法读取
# 目标特性，生成 catch wrapper 时报 "externref table required"。
# 用 "debuginfo" 可在保留该段的前提下剥离调试信息，最终体积由 wasm-opt 决定。
strip = "debuginfo"
